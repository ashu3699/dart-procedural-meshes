name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # Pinned: the ubuntu-26 migration starts 2026-10-19.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: dart-lang/setup-dart@v1

      - name: Resolve (zero dependencies)
        run: dart pub get

      - name: Analyze
        run: dart analyze

      - name: Checks
        run: dart run bin/check.dart
